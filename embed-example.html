<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Embed Example</title>
<style>
  body { font: 18px/1.5 Helvetica, Arial, sans-serif; margin: 0; background: #fff; color: #000; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 48px 16px; }
  h2 { font-size: 36px; font-weight: 400; margin: 0 0 16px; }
  h2 span { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; }

  /* Copy this block ↓ */
  .gua-map-band { background: #dee3e1; }
  .gua-map { position: relative; width: 100%; aspect-ratio: 16 / 10; min-height: 440px; }
  .gua-map iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* ↑ */
</style>
</head>
<body>
  <!-- Copy from here ↓ -->
  <section class="gua-map-band">
    <div class="wrap">
      <h2><span>Where we teach</span></h2>
      <p>Global University Academy partner universities and teaching locations.</p>
      <div class="gua-map">
        <iframe src="map.html"
                title="Map of Global University Academy partners and teaching locations"
                loading="lazy"></iframe>
      </div>
    </div>
  </section>
  <!-- to here ↑ (plus the CSS block above) -->

  <div class="wrap">
    <p>Filter with <code>?type=member</code> or <code>?type=teaching</code>.</p>
  </div>
</body>
</html>
