<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Embed Example</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 960px; margin: 0 auto; padding: 24px 16px; background: #fff; color: #1d232b; }
  .map-embed { position: relative; width: 100%; aspect-ratio: 16 / 10; min-height: 360px; }
  .map-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 8px; }
</style>
</head>
<body>
  <h1>Where we teach</h1>
  <p>Global University Academy members, partners and the refugee camps where we teach.</p>

  <!-- Copy from here ↓ -->
  <div class="map-embed">
    <iframe src="map.html"
            title="Map of Global University Academy partners and teaching locations"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
  <!-- to here ↑ (plus the .map-embed CSS above) -->

  <p>Filter with <code>?type=member</code>, <code>?type=contributor</code> or <code>?type=teaching</code>.</p>
</body>
</html>
