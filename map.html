<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GUA Partners Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* Palette and type taken from globaluniversityacademy.org */
  :root {
    --ink: #18191c;            /* site's near-black (footer, primary buttons) */
    --green: #244537;          /* site's info-box accent */
    --sage: #dee3e1;           /* site's grey-green panels */
    --muted: rgba(0, 0, 0, .7);/* site's date / meta grey */
    --font: Helvetica, Arial, sans-serif;
    --member: var(--ink);
    --teaching: var(--green);
  }
  html, body { height: 100%; margin: 0; }
  body {
    font: 16px/1.4 var(--font); color: #000; background: #fff;
    display: flex; flex-direction: column;
  }
  #map { flex: 1; min-height: 0; background: #fff; }
  .leaflet-container { font: 15px/1.4 var(--font); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }


  /* Pins */
  .pin { display: block; border-radius: 50%; box-sizing: border-box; transition: transform .15s ease; }
  .pin.member   { width: 12px; height: 12px; background: #fff; border: 2.5px solid var(--member); }
  .pin.teaching { width: 18px; height: 18px; background: var(--teaching); border: 2.5px solid #fff; box-shadow: 0 0 0 1px var(--teaching); }
  .leaflet-marker-icon:hover .pin,
  .leaflet-marker-icon:focus .pin { transform: scale(1.35); }

  /* Clusters: flat discs, white number */
  .cluster {
    display: flex; align-items: center; justify-content: center; border-radius: 50%;
    color: #fff; font: 13px/1 var(--font); border: 2px solid #fff; box-sizing: border-box;
    transition: transform .15s ease;
  }
  .cluster.member { background: #fff; color: var(--member); border: 2px solid var(--member); }
  .cluster.teaching { background: var(--teaching); }
  .leaflet-marker-icon:hover .cluster { transform: scale(1.12); }

  /* Popups: square, thin black rule, no shadow */
  .leaflet-popup-content-wrapper { border-radius: 0; box-shadow: none; border: 1px solid var(--ink); }
  .leaflet-popup-tip-container { margin-top: -1px; }
  .leaflet-popup-tip { box-shadow: 0 0 0 1px var(--ink); }
  .leaflet-popup-content { margin: 14px 28px 14px 16px; }
  .leaflet-container a.leaflet-popup-close-button { color: #000; }
  .popup .meta { font-size: 13px; color: var(--muted); }
  .popup h3 { margin: 4px 0 0; font-size: 18px; font-weight: 400; line-height: 1.3; }
  .popup h3 a { color: #000; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .popup p { margin: 8px 0 0; font-size: 14px; color: var(--muted); }

  /* Zoom control: square, flat */
  .leaflet-bar { border: 1px solid var(--ink) !important; border-radius: 0; box-shadow: none !important; }
  .leaflet-bar a, .leaflet-bar a:first-child, .leaflet-bar a:last-child { border-radius: 0 !important; color: var(--ink); }
  .leaflet-bar a { border-bottom-color: var(--ink); }

  .leaflet-control-attribution { font-size: 10px; color: var(--muted); background: rgba(255,255,255,.75) !important; }
  .leaflet-control-attribution a { color: var(--muted); }

  /* Key under the map (doubles as the filter) */
  .key {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px;
    padding: 12px 2px 2px; background: #fff;
  }
  .key button {
    display: inline-flex; align-items: center; gap: 10px; padding: 4px 0;
    border: 0; background: none; font: inherit; color: #000; cursor: pointer;
    text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px;
  }
  .key button[aria-pressed="false"] { color: var(--muted); text-decoration-color: transparent; }
  .key button[aria-pressed="false"] .pin { opacity: .3; }
  .key .count { color: var(--muted); }
  .key input[type=search] {
    margin-left: auto; width: 220px; max-width: 100%; box-sizing: border-box;
    padding: 7px 10px; border: 1px solid var(--ink); border-radius: 0; font: 15px var(--font);
  }

  @media (max-width: 560px) {
    body { font-size: 15px; }
    .key { gap: 6px 18px; }
    .key input[type=search] { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<div id="map" role="region" aria-label="Map of Global University Academy partners and teaching locations"></div>
<div class="key" id="key"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script>
/* ------------------------------------------------------------------
   DATA — Global University Academy (GUA), from
   globaluniversityacademy.org/about-us (checked 19 Nov 2026).
   University pins mark each main campus (approximate).
   type: "member"   = partner (member) university
         "teaching" = teaching location
   ------------------------------------------------------------------ */
const MEMBERS = [
  ["Arizona State University", "Tempe, USA", 33.4242, -111.9281, "https://www.asu.edu"],
  ["Al Hussein Technical University", "Amman, Jordan", 31.9820, 35.8360, "https://htu.edu.jo/"],
  ["Bard College – Hubs for Connected Learning Initiatives", "Annandale-on-Hudson, USA", 42.0207, -73.9086, "https://hubs.bard.edu/"],
  ["German Jordanian University", "Madaba, Jordan", 31.7766, 35.8016, "https://www.gju.edu.jo/"],
  ["Gulu University", "Gulu, Uganda", 2.7837, 32.3006, "https://gu.ac.ug/"],
  ["Humboldt University of Berlin", "Berlin, Germany", 52.5180, 13.3936, "https://www.hu-berlin.de/en"],
  ["KU Leuven", "Leuven, Belgium", 50.8775, 4.7005, "https://www.kuleuven.be/english/kuleuven"],
  ["Makerere University", "Kampala, Uganda", 0.3349, 32.5675, "https://www.mak.ac.ug/"],
  ["Norwegian University of Life Sciences", "Ås, Norway", 59.6660, 10.7690, "https://www.nmbu.no/en/"],
  ["Paris Sciences & Lettres University", "Paris, France", 48.8418, 2.3448, "https://psl.eu/en"],
  ["SOAS, University of London", "London, UK", 51.5222, -0.1290, "https://www.soas.ac.uk/"],
  ["Southern New Hampshire University", "Manchester, New Hampshire, USA", 43.0400, -71.4530, "https://www.snhu.edu/"],
  ["Stellenbosch University", "Stellenbosch, South Africa", -33.9321, 18.8648, "https://www.su.ac.za/en"],
  ["The Open University", "Milton Keynes, UK", 52.0250, -0.7090, "https://www.open.ac.uk/"],
  ["University of Bergen", "Bergen, Norway", 60.3880, 5.3230, "https://www4.uib.no/en"],
  ["University of Cape Town", "Cape Town, South Africa", -33.9577, 18.4612, "https://www.uct.ac.za/"],
  ["UCLouvain", "Louvain-la-Neuve, Belgium", 50.6680, 4.6118, "https://uclouvain.be/en"],
  ["University of Geneva", "Geneva, Switzerland", 46.1990, 6.1450, "https://www.unige.ch/en/"],
  ["University of Groningen", "Groningen, Netherlands", 53.2194, 6.5630, "https://www.rug.nl/?lang=en"],
  ["University of Hamburg", "Hamburg, Germany", 53.5670, 9.9840, "https://www.uni-hamburg.de/en.html"],
  ["University of Oslo", "Oslo, Norway", 59.9400, 10.7220, "https://www.uio.no/english/index.html"],
  ["University of Toronto", "Toronto, Canada", 43.6629, -79.3957, "https://www.utoronto.ca/"],
];

/* Teaching locations — one row per site (duplicates in the source list
   removed). Coordinates are approximate: camp centre for camps, city
   centre for cities. "Online" and "Multiple sites" rows have no single
   place and are not mapped.
   [site, "Country · Region", lat, lng, url, note] */
const TEACHING = [
  // Middle East
  ["Azraq",       "Jordan · Middle East",           31.9050, 36.6160],
  ["Zaatari",     "Jordan · Middle East",           32.2950, 36.3260],
  ["Beirut",      "Lebanon · Middle East",          33.8938, 35.5018],
  ["Tripoli",     "Lebanon · Middle East",          34.4367, 35.8497],
  ["Bekaa",       "Lebanon · Middle East",          33.8463, 35.9020, "", "Bekaa Valley; pin at Zahle."],
  ["Arsal",       "Lebanon · Middle East",          34.1786, 36.4194],
  ["Gaziantep",   "Turkey · Middle East",           37.0662, 37.3833],
  // Eastern & Southern Africa
  ["Kakuma",      "Kenya · Eastern Africa",          3.7300, 34.8500],
  ["Kalobeyei",   "Kenya · Eastern Africa",          3.7800, 34.7300],
  ["Nairobi",     "Kenya · Eastern Africa",         -1.2921, 36.8219],
  ["Kampala",     "Uganda · Eastern Africa",         0.3476, 32.5825],
  ["Kigali",      "Rwanda · Eastern Africa",        -1.9441, 30.0619],
  ["Kiziba",      "Rwanda · Eastern Africa",        -2.0900, 29.3500],
  ["Dzaleka",     "Malawi · Eastern Africa",       -13.6600, 33.8700],
  ["Cape Town",   "South Africa · Southern Africa", -33.9249, 18.4241],
  // Central & West Africa
  ["Iridimi",     "Chad · Central Africa",          15.0900, 22.2300, "", "Near Iriba; position approximate."],
  ["Niamey",      "Niger · West Africa",            13.5116,  2.1254],
  // Asia
  ["Cox's Bazar", "Bangladesh · South Asia",        21.2100, 92.1600, "", "Kutupalong–Balukhali camp area."],
  ["Mae Sot",     "Thailand · South-East Asia",     16.7130, 98.5740],
];

const row = type => ([name, city, lat, lng, url = "", description = ""]) => ({ type, name, city, lat, lng, url, description });
const LOCATIONS = [
  ...MEMBERS.map(row("member")),
  ...TEACHING.map(row("teaching")),
];

const TYPES = {
  member:   { label: "Partner universities", one: "Partner university" },
  teaching: { label: "Teaching locations",   one: "Teaching location" },
};

/* Optional URL params when embedding:
   ?type=member | teaching   show only one category
   ?cluster=0                 turn off marker clustering
   ?scroll=1                  allow scroll-wheel zoom (off by default so the
                              host page scrolls normally over the iframe)     */
const params = new URLSearchParams(location.search);
const onlyType = params.get("type");
const useCluster = params.get("cluster") !== "0";

const map = L.map("map", {
  worldCopyJump: true,
  scrollWheelZoom: params.get("scroll") === "1",
  minZoom: 2,
  maxZoom: 18,   // required by markercluster (the GL basemap doesn't set one)
}).setView([20, 0], 2);

// Basemap: OpenFreeMap "Positron" (https://openfreemap.org) — free, no API
// key or account, no request limits, commercial use allowed, MIT-licensed.
// Its only condition is the attribution below, which also satisfies the
// OpenStreetMap data licence (ODbL). Rendered with MapLibre GL.
L.maplibreGL({
  style: "https://tiles.openfreemap.org/styles/positron",
  attribution:
    '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> ' +
    '<a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">&copy; OpenMapTiles</a> ' +
    'Data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">&copy; OpenStreetMap contributors</a>',
}).addTo(map);

// Let users scroll-zoom after clicking into the map.
map.on("click", () => map.scrollWheelZoom.enable());
map.on("mouseout", () => { if (params.get("scroll") !== "1") map.scrollWheelZoom.disable(); });

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function icon(type) {
  const s = type === "teaching" ? 22 : 16;
  return L.divIcon({
    className: "",
    html: `<span class="pin ${type}"></span>`,
    iconSize: [s, s],
    iconAnchor: [s / 2, s / 2],
    popupAnchor: [0, -s / 2],
  });
}

function popupHtml(loc) {
  const title = loc.url
    ? `<a href="${esc(loc.url)}" target="_blank" rel="noopener">${esc(loc.name)}</a>`
    : esc(loc.name);
  return `<div class="popup">
    <div class="meta">${esc(TYPES[loc.type].one)}${loc.city ? ` · ${esc(loc.city)}` : ""}</div>
    <h3>${title}</h3>
    ${loc.description ? `<p>${esc(loc.description)}</p>` : ""}
  </div>`;
}

function clusterIcon(type) {
  return cluster => {
    const n = cluster.getChildCount();
    const s = n < 5 ? 28 : n < 15 ? 34 : 40;
    return L.divIcon({
      className: "",
      html: `<span class="cluster ${type}" style="width:${s}px;height:${s}px">${n}</span>`,
      iconSize: [s, s],
    });
  };
}

// One layer group per type
const groups = {};
const markers = [];
for (const type of Object.keys(TYPES)) {
  groups[type] = useCluster
    ? L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 40, iconCreateFunction: clusterIcon(type) })
    : L.layerGroup();
}

for (const loc of LOCATIONS) {
  if (!TYPES[loc.type]) continue;
  const m = L.marker([loc.lat, loc.lng], { icon: icon(loc.type), title: loc.name, keyboard: true })
    .bindPopup(popupHtml(loc));
  m._loc = loc;
  markers.push(m);
}

const state = { visible: new Set(onlyType && TYPES[onlyType] ? [onlyType] : Object.keys(TYPES)), q: "" };

function render(fit) {
  for (const g of Object.values(groups)) { g.clearLayers(); map.removeLayer(g); }
  const q = state.q.toLowerCase();
  const shown = [];
  for (const m of markers) {
    const l = m._loc;
    if (!state.visible.has(l.type)) continue;
    if (q && !`${l.name} ${l.city} ${l.description}`.toLowerCase().includes(q)) continue;
    groups[l.type].addLayer(m);
    shown.push(m.getLatLng());
  }
  for (const t of state.visible) groups[t].addTo(map);
  if (fit && shown.length) fitTo(shown);
}

function fitTo(points, animate = true) {
  const size = map.getSize();
  if (!size.x || !size.y) return; // iframe not laid out yet; the ResizeObserver refits later
  map.fitBounds(L.latLngBounds(points), { padding: [40, 40], maxZoom: 6, animate });
}

// Key under the map — each entry toggles its category.
(function buildKey() {
  const key = document.getElementById("key");
  const counts = Object.fromEntries(Object.keys(TYPES).map(t => [t, LOCATIONS.filter(l => l.type === t).length]));
  key.innerHTML =
    Object.entries(TYPES).map(([t, cfg]) => `
      <button type="button" data-type="${t}" aria-pressed="${state.visible.has(t)}">
        <span class="pin ${t}"></span><span>${cfg.label} <span class="count">(${counts[t]})</span></span>
      </button>`).join("") +
    `<input type="search" placeholder="Search name or place" aria-label="Search locations">`;
  key.addEventListener("click", e => {
    const b = e.target.closest("button[data-type]");
    if (!b) return;
    const t = b.dataset.type;
    state.visible.has(t) ? state.visible.delete(t) : state.visible.add(t);
    b.setAttribute("aria-pressed", state.visible.has(t));
    render(false);
  });
  key.querySelector("input[type=search]").addEventListener("input", e => {
    state.q = e.target.value.trim();
    render(!!state.q);
  });
})();

render(false);

// Fit to all markers once the iframe has a real size, and keep the map
// correct when the host page resizes the iframe.
let userMoved = false;
for (const ev of ["mousedown", "touchstart", "wheel", "keydown"]) {
  map.getContainer().addEventListener(ev, () => { userMoved = true; }, { passive: true });
}
new ResizeObserver(() => {
  map.invalidateSize({ animate: false });
  if (userMoved) return;
  const pts = markers.filter(m => state.visible.has(m._loc.type)).map(m => m.getLatLng());
  if (pts.length) fitTo(pts, false);
}).observe(map.getContainer());
</script>
</body>
</html>
